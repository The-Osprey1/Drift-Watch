# Computer tests and both firmware images on every push and pull request. On a push to main,
# once both have passed, the Drift sync page (companion/ only) is published to GitHub Pages.
# Pull requests never publish.
#
# Every action is pinned to a full commit, with its release tag in the comment beside it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# bash with pipefail, so a failing build is not hidden behind tee.
defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Computer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Get the TFT_eSPI source (fonts for the screen stand-in)
        run: git clone --depth 1 --branch V2.5.43 https://github.com/Bodmer/TFT_eSPI.git "$RUNNER_TEMP/TFT_eSPI"
      # Our code with warnings as errors and the address and undefined behaviour sanitizers.
      # TFT_eSPI is included as a system folder, so only its own warnings are left out.
      - name: Faces, interface, interface with network, network and power tests
        env:
          HOST_STRICT: "1"
        run: tools/host/run_tests.sh "$RUNNER_TEMP/TFT_eSPI" tools/host/out
      - name: Known bugs put back are caught
        run: tools/host/mutation_check.sh "$RUNNER_TEMP/TFT_eSPI" | tee tools/host/out/mutations.log
      - name: Keep the frames, logs and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: simulation-output
          path: |
            tools/host/out/*.ppm
            tools/host/out/*.log
            tools/host/out/report.md
          if-no-files-found: ignore

  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02  # v2.0.0
        with:
          version: 1.1.1
      - name: Install the ESP32 core 2.0.17 and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "TFT_eSPI@2.5.43" "WiFiManager@2.0.17"
          pip install pyserial
          ESPTOOL=$(find "$(arduino-cli config get directories.data)" -path '*esptool_py/*/esptool.py' | head -1)
          chmod +x "$ESPTOOL"
          dirname "$ESPTOOL" >> "$GITHUB_PATH"
      # Each build starts clean and shows every warning. Warnings in the ESP32 core and the
      # libraries are recorded in the report; a warning in our own code fails the job.
      - name: Build the firmware
        run: |
          rm -rf build out
          DRIFT_WARNINGS=all bash build.sh 2>&1 | tee build-normal.log
          mkdir -p reports && cp out/*.bin reports/ && rm -rf build
      - name: Build the diagnostic firmware
        run: |
          DRIFT_DIAG=1 DRIFT_WARNINGS=all bash build.sh 2>&1 | tee build-diag.log
          cp out/*.bin reports/
      - name: Warning report
        if: always()
        run: |
          status=0
          for b in normal diag; do
            tools/warning_report.sh build-$b.log > reports/warnings-$b.md || status=1
            cat reports/warnings-$b.md >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: firmware
          path: |
            reports/
            build-*.log

  pages:
    name: Publish the Drift sync page
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host-tests, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: companion
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
