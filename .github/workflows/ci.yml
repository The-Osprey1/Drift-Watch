# Computer tests and both firmware images on every push and pull request. On a push to main,
# once both have passed, the Drift sync page (companion/ only) is published to GitHub Pages.
# Pull requests never publish.
#
# Every action is pinned to a full commit, with its release tag in the comment beside it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# bash with pipefail, so a failing build is not hidden behind tee.
defaults:
  run:
    shell: bash

jobs:
  host-tests:
    name: Computer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Get the TFT_eSPI source (fonts for the screen stand-in)
        run: git clone --depth 1 --branch V2.5.43 https://github.com/Bodmer/TFT_eSPI.git "$RUNNER_TEMP/TFT_eSPI"
      # Our code with warnings as errors and the address and undefined behaviour sanitizers.
      # TFT_eSPI is included as a system folder, so only its own warnings are left out.
      - name: Faces, interface, interface with network, network and power tests
        env:
          HOST_STRICT: "1"
        run: tools/host/run_tests.sh "$RUNNER_TEMP/TFT_eSPI" tools/host/out
      - name: Known bugs put back are caught
        run: tools/host/mutation_check.sh "$RUNNER_TEMP/TFT_eSPI" | tee tools/host/out/mutations.log
      - name: Render face gallery and motion review
        if: always()
        run: |
          python3 -m pip install Pillow
          python3 tools/host/preview_sheet.py tools/host/out --log-preview
          # Keep representative test frames; the GIF already contains the animation sequence.
          rm -f tools/host/out/preview_*.ppm
      - name: Keep the frames, logs and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: simulation-output
          path: |
            tools/host/out/*.ppm
            tools/host/out/*.png
            tools/host/out/*.gif
            tools/host/out/*.log
            tools/host/out/report.md
          if-no-files-found: ignore

  firmware:
    name: Firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02  # v2.0.0
        with:
          version: 1.1.1
      - name: Install the ESP32 core 2.0.17 and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install "TFT_eSPI@2.5.43" "WiFiManager@2.0.17"
          pip install pyserial
          ESPTOOL=$(find "$(arduino-cli config get directories.data)" -path '*esptool_py/*/esptool.py' | head -1)
          chmod +x "$ESPTOOL"
          dirname "$ESPTOOL" >> "$GITHUB_PATH"
      # Each build starts clean and shows every warning. Warnings in the ESP32 core and the
      # libraries are recorded in the report; a warning in our own code fails the job.
      - name: Build the firmware
        run: |
          rm -rf build out
          DRIFT_WARNINGS=all bash build.sh 2>&1 | tee build-normal.log
          mkdir -p reports && cp out/*.bin reports/ && rm -rf build
      - name: Build the diagnostic firmware
        run: |
          DRIFT_DIAG=1 DRIFT_WARNINGS=all bash build.sh 2>&1 | tee build-diag.log
          cp out/*.bin reports/
      - name: Check both images (layout, size, version, no stray names or test passwords)
        run: python3 tools/validate_image.py "$(grep -oP 'FW_VERSION "\K[^"]+' DriftWatch/board.h)" reports/*.bin
      - name: Warning report
        if: always()
        run: |
          status=0
          for b in normal diag; do
            tools/warning_report.sh build-$b.log > reports/warnings-$b.md || status=1
            cat reports/warnings-$b.md >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: firmware
          path: |
            reports/
            build-*.log

  pages:
    name: Publish the Drift sync page
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [host-tests, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: companion
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
