; Open firmware for the Waveshare ESP32-S3-Touch-LCD-1.28.
; Alternative to build.sh for a PC with PlatformIO. Not tested yet: build.sh is the checked route.
; Build and flash over USB:  pio run -t upload

[platformio]
src_dir = DriftWatch

[env:watch]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = app3M_fat9M_16MB.csv
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI@2.5.43
  tzapu/WiFiManager@2.0.17

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; TFT_eSPI setup for the round GC9A01 screen, so no library files need editing
  -DUSER_SETUP_LOADED=1
  -DGC9A01_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=12
  -DTFT_MOSI=11
  -DTFT_SCLK=10
  -DTFT_CS=9
  -DTFT_DC=8
  -DTFT_RST=14
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=80000000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DDISABLE_ALL_LIBRARY_WARNINGS=1
